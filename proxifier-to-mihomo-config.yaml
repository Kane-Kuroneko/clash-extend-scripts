  - IP-CIDR6,::1/128,DIRECT,no-resolve

  # [%ComputerName%] - 计算机名变量(Mihomo不支持,需手动替换或忽略)
  # 注意: Proxifier的%ComputerName%变量在Mihomo中无法直接使用
  # 建议使用IP-CIDR规则或DOMAIN规则替代
