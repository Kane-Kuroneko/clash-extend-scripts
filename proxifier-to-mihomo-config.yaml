# ==========================================
# 代理组定义
# ==========================================
# 注意: 这里定义的代理组对应原Proxifier配置中的Proxy列表
# 您需要在实际的CV配置中添加这些代理节点

proxy-groups:
  # 默认代理组 - 对应 Proxy 100 (ClashVergeRev HTTPS 7890)
  - name: "ClashVergeRev-HTTPS"
    type: select
    proxies:
      - DIRECT
      # - 您的节点名称

  # 代理组 - 对应 Proxy 101 (ClashParty SOCKS5 7897)
  - name: "ClashParty-SOCKS5"
    type: select
    proxies:
      - DIRECT
      # - 您的节点名称

  # 代理组 - 对应 Proxy 102 (ClashParty HTTPS 7897)
  - name: "ClashParty-HTTPS"
    type: select
    proxies:
      - DIRECT
      # - 您的节点名称

  # 代理组 - 对应 Proxy 103 (ClashVergeRev SOCKS5 7890)
  - name: "ClashVergeRev-SOCKS5"
    type: select
    proxies:
      - DIRECT
      # - 您的节点名称

  # 统一代理组 (用于简化规则,可选)
  - name: "Proxy"
    type: select
    proxies:
      - ClashVergeRev-HTTPS
      - ClashParty-SOCKS5
      - ClashParty-HTTPS
      - ClashVergeRev-SOCKS5
      - DIRECT

# ==========================================
# 转换说明
# ==========================================
# 1. Proxifier 的 Proxy ID 映射:
#    - 100: ClashVergeRev (HTTPS, 127.0.0.1:7890)
#    - 101: ClashParty (SOCKS5, 127.0.0.1:7897)
#    - 102: ClashParty (HTTPS, 127.0.0.1:7897)
#    - 103: ClashVergeRev (SOCKS5, 127.0.0.1:7890)
#
# 2. 转换规则:
#    - Applications -> PROCESS-NAME / PROCESS-PATH
#    - Targets (域名) -> DOMAIN / DOMAIN-SUFFIX / DOMAIN-KEYWORD
#    - Targets (IP) -> IP-CIDR
#    - 同时包含 Applications 和 Targets 的规则 -> AND 逻辑组合
#    - Action: Direct -> DIRECT
#    - Action: Proxy -> Proxy (需在proxy-groups中配置)
#    - Action: Block -> REJECT
#
# 3. 通配符转换策略:
#    - *.xxx.* -> DOMAIN-KEYWORD,xxx (更宽松的匹配)
#    - *.xxx.com -> DOMAIN-SUFFIX,xxx.com
#    - xxx* -> DOMAIN-KEYWORD,xxx
#
# 4. 注意事项:
#    - 通配符规则 (*.xxx.*) 已转换为 DOMAIN-SUFFIX 或 DOMAIN-KEYWORD
#    - 短名称 (如 steam, zhihu) 保留为 DOMAIN
#    - IP地址范围使用 CIDR 格式
#    - 已禁用的规则保留在注释中
#    - %ComputerName% 变量在 Mihomo 中不支持,已忽略
#    - leagueclient.exe 同时出现在直连和代理规则中,以先匹配为准
#
# 5. 使用前需调整:
#    - 在 proxy-groups 中添加实际的代理节点
#    - 根据实际需求调整策略组类型 (select/url-test/fallback)
#    - 检查 PROCESS-PATH 的路径是否正确
#    - 确认 find-process-mode 设置是否符合需求
#    - 检查规则优先级顺序是否符合预期
#    - 测试关键应用的网络连接是否正常
#
# 6. 重要提醒:
#    - Mihomo 规则从上到下匹配,第一条匹配的规则生效
#    - 进程匹配需要在 TUN 模式下才能正常工作
#    - 建议在应用前先在测试环境验证
#    - 建议保留原始 Proxifier 配置作为备份
