# Proxifier 配置转换为 Mihomo 格式
# 转换说明：
# - 使用 AND 逻辑实现进程名+域名+端口的复合匹配
# - Proxy 100/103 (7890 - ClashVergeRev) 已忽略，由 tun 模式处理
# - Proxy 101/102 (7897 - ClashParty) 转换为 ProxyA
# - Direct 转换为 DIRECT
# - Block 转换为 REJECT

